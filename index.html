<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Hello World - Three.js Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .ui-text {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        #title {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        #fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: monospace;
            font-size: 14px;
            color: rgba(100, 255, 150, 0.7);
        }
        
        #hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div id="title" class="ui-text">🌌 Hello World — Three.js 星系</div>
        <div id="fps-counter" class="ui-text">0</div>
        <div id="hint" class="ui-text">🖱 拖动旋转 · 滚轮缩放 · 点击任意位置</div>
    </div>
    
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Configuration
        const CONFIG = {
            desktopParticles: 10000,
            mobileParticles: 6000,
            starfieldCount: 800,
            arms: 3,
            armSpread: 0.5,
            rotationSpeed: 0.0002,
            galaxyRadius: 80,
            bulgeRadius: 8
        };
        
        // Detect mobile device
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
        const particleCount = isTouchDevice ? CONFIG.mobileParticles : CONFIG.desktopParticles;
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 40, 80);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ 
            antialias: false,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
        renderer.setClearColor(0x000000, 1);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.minDistance = 10;
        controls.maxDistance = 200;
        controls.enablePan = false;
        
        let galaxyRef = null;
        let haloRef = null;
        
        // Generate particle galaxy: 3-arm logarithmic spiral with warm-to-cool gradient
        function generateGalaxy(scene, particleCount) {
            if (!scene) {
                return null;
            }
            
            const count = Math.max(0, Math.floor(Number(particleCount) || 0));
            
            if (galaxyRef) {
                scene.remove(galaxyRef);
                galaxyRef.geometry.dispose();
                galaxyRef.material.dispose();
                galaxyRef = null;
            }
            if (haloRef) {
                scene.remove(haloRef);
                if (haloRef.geometry) haloRef.geometry.dispose();
                if (haloRef.material) haloRef.material.dispose();
                haloRef = null;
            }
            
            if (count === 0) {
                return null;
            }
            
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            
            const armOffset = (Math.PI * 2) / CONFIG.arms;
            const spiralB = 0.12;
            const particleColor = new THREE.Color();
            
            for (let i = 0; i < count; i++) {
                const radialT = 1 - (i / Math.max(count - 1, 1));
                const armIndex = i % CONFIG.arms;
                const armAngle = armIndex * armOffset;
                
                const radius = radialT * CONFIG.galaxyRadius + Math.random() * 1.5;
                const theta = Math.log(Math.max(radius, 0.5)) / spiralB + armAngle;
                const scatter = radius * 0.12;
                
                const x = Math.cos(theta) * radius + (Math.random() - 0.5) * scatter;
                const z = Math.sin(theta) * radius + (Math.random() - 0.5) * scatter;
                const verticalSpread = (1 - radialT * 0.7) * 4;
                const y = (Math.random() - 0.5) * verticalSpread * 2;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                
                const hue = (40 + radialT * 210) / 360;
                particleColor.setHSL(hue, 0.85 + Math.random() * 0.1, 0.45 + radialT * 0.15);
                colors[i * 3] = particleColor.r;
                colors[i * 3 + 1] = particleColor.g;
                colors[i * 3 + 2] = particleColor.b;
                
                const centerBoost = Math.max(0, 1 - radialT * 2) * 0.5;
                sizes[i] = 0.5 + Math.random() * 1.5 + centerBoost;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const material = new THREE.PointsMaterial({
                size: 1,
                vertexColors: true,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.userData.isGalaxy = true;
            scene.add(particles);
            galaxyRef = particles;
            
            const coreLight = new THREE.PointLight(0xffaa44, 2.5, 60);
            coreLight.position.set(0, 0, 0);
            scene.add(coreLight);
            haloRef = coreLight;
            
            return particles;
        }
        
        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;
        window.controls = controls;
        window.generateGalaxy = generateGalaxy;
        
        // Starfield background
        function createStarfield() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CONFIG.starfieldCount * 3);
            const sizes = new Float32Array(CONFIG.starfieldCount);
            
            for (let i = 0; i < CONFIG.starfieldCount; i++) {
                // Random sphere distribution
                const radius = 150 + Math.random() * 300;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);
                
                sizes[i] = 0.1 + Math.random() * 0.3;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            return geometry;
        }
        
        const starfieldGeometry = createStarfield();
        const starfieldMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.6
        });
        
        const starfield = new THREE.Points(starfieldGeometry, starfieldMaterial);
        scene.add(starfield);
        
        const galaxy = generateGalaxy(scene, particleCount);
        
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        const fpsElement = document.getElementById('fps-counter');
        
        function updateFPS() {
            const now = performance.now();
            frameCount++;
            
            if (now - lastFpsUpdate >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                fpsElement.textContent = `${fps} FPS`;
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }
        
        // Animation loop
        let animationId;
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            if (galaxyRef) {
                galaxyRef.rotation.y += CONFIG.rotationSpeed;
            }
            
            // Slowly rotate starfield in opposite direction
            starfield.rotation.y -= CONFIG.rotationSpeed * 0.1;
            
            controls.update();
            updateFPS();
            renderer.render(scene, camera);
        }
        
        // Start animation
        animate();
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.animate = animate;
        window.onWindowResize = onWindowResize;
        window.updateFPS = updateFPS;
        
        window.addEventListener('resize', onWindowResize);
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            cancelAnimationFrame(animationId);
            if (galaxyRef) {
                galaxyRef.geometry.dispose();
                galaxyRef.material.dispose();
            }
            starfieldGeometry.dispose();
            starfieldMaterial.dispose();
            renderer.dispose();
        });
    </script>
</body>
</html>
