<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Three.js Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .ui-text {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        #title {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        #fps-counter {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-family: monospace;
            font-size: 14px;
            color: rgba(100, 255, 150, 0.7);
        }
        
        #hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 0.5px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div id="title" class="ui-text">Hello World - Three.js Galaxy</div>
        <div id="fps-counter" class="ui-text">60 FPS</div>
        <div id="hint" class="ui-text">Drag to rotate | Scroll to zoom | Click anywhere</div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Configuration
        const CONFIG = {
            desktopParticles: 12000,
            mobileParticles: 6000,
            starfieldCount: 2000,
            arms: 3,
            armSpread: 0.5,
            rotationSpeed: 0.0005,
            galaxyRadius: 80,
            bulgeRadius: 8
        };
        
        // Detect mobile device
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
        const particleCount = isTouchDevice ? CONFIG.mobileParticles : CONFIG.desktopParticles;
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 40, 80);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // OrbitControls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.minDistance = 10;
        controls.maxDistance = 200;
        controls.enablePan = false;
        
        // Galaxy colors
        const colors = {
            center: new THREE.Color(0xffaa00),
            mid1: new THREE.Color(0xff6600),
            mid2: new THREE.Color(0x4488ff),
            edge: new THREE.Color(0x8822ff)
        };
        
        // Generate galaxy geometry
        function createGalaxy() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            
            const colorCenter = new THREE.Color(0xffaa00);
            const colorMid = new THREE.Color(0xff6600);
            const colorEdge1 = new THREE.Color(0x4488ff);
            const colorEdge2 = new THREE.Color(0x8822ff);
            
            for (let i = 0; i < particleCount; i++) {
                // Spiral parameters
                const armIndex = i % CONFIG.arms;
                const armAngle = (armIndex / CONFIG.arms) * Math.PI * 2;
                
                // Logarithmic spiral: r = a * e^(b * theta)
                const t = Math.random();
                const radius = t * CONFIG.galaxyRadius;
                const spiralTightness = 0.3;
                const angle = armAngle + radius * spiralTightness + (Math.random() - 0.5) * CONFIG.armSpread;
                
                // Add some randomness to make it look more natural
                const scatter = radius * 0.15;
                const x = Math.cos(angle) * radius + (Math.random() - 0.5) * scatter;
                const z = Math.sin(angle) * radius + (Math.random() - 0.5) * scatter;
                
                // Vertical distribution (thinner disk at edges)
                const verticalSpread = (1 - t * 0.7) * 4;
                const y = (Math.random() - 0.5) * verticalSpread * 2;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                
                // Color gradient based on distance from center
                const normalizedRadius = radius / CONFIG.galaxyRadius;
                const particleColor = new THREE.Color();
                
                if (normalizedRadius < 0.3) {
                    // Center: warm yellow-orange
                    const localT = normalizedRadius / 0.3;
                    particleColor.copy(colorCenter).lerp(colorMid, localT);
                } else if (normalizedRadius < 0.7) {
                    // Mid: orange to blue
                    const localT = (normalizedRadius - 0.3) / 0.4;
                    particleColor.copy(colorMid).lerp(colorEdge1, localT);
                } else {
                    // Edge: blue to purple
                    const localT = (normalizedRadius - 0.7) / 0.3;
                    particleColor.copy(colorEdge1).lerp(colorEdge2, localT);
                }
                
                // Add slight color variation
                particleColor.r += (Math.random() - 0.5) * 0.1;
                particleColor.g += (Math.random() - 0.5) * 0.1;
                particleColor.b += (Math.random() - 0.5) * 0.1;
                
                colors[i * 3] = particleColor.r;
                colors[i * 3 + 1] = particleColor.g;
                colors[i * 3 + 2] = particleColor.b;
                
                // Size: larger near center, smaller at edges
                const centerBoost = Math.max(0, 1 - normalizedRadius * 2) * 0.5;
                const baseSize = 0.02 + Math.random() * 0.13;
                sizes[i] = baseSize + centerBoost;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            return geometry;
        }
        
        // Create galaxy mesh
        const galaxyGeometry = createGalaxy();
        
        // Custom shader material for better control
        const galaxyMaterial = new THREE.PointsMaterial({
            size: 1,
            vertexColors: true,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        
        const galaxy = new THREE.Points(galaxyGeometry, galaxyMaterial);
        scene.add(galaxy);
        
        // Starfield background
        function createStarfield() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CONFIG.starfieldCount * 3);
            const sizes = new Float32Array(CONFIG.starfieldCount);
            
            for (let i = 0; i < CONFIG.starfieldCount; i++) {
                // Random sphere distribution
                const radius = 150 + Math.random() * 300;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);
                
                sizes[i] = 0.1 + Math.random() * 0.3;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            return geometry;
        }
        
        const starfieldGeometry = createStarfield();
        const starfieldMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.6
        });
        
        const starfield = new THREE.Points(starfieldGeometry, starfieldMaterial);
        scene.add(starfield);
        
        // Core glow
        const coreGeometry = new THREE.SphereGeometry(3, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.3
        });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);
        
        // Point light at center
        const coreLight = new THREE.PointLight(0xffaa00, 2, 50);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);
        
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        const fpsElement = document.getElementById('fps-counter');
        
        function updateFPS() {
            const now = performance.now();
            frameCount++;
            
            if (now - lastFpsUpdate >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                fpsElement.textContent = `${fps} FPS`;
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }
        
        // Animation loop
        let animationId;
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Rotate galaxy
            galaxy.rotation.y += CONFIG.rotationSpeed;
            core.rotation.y += CONFIG.rotationSpeed * 0.5;
            
            // Slowly rotate starfield in opposite direction
            starfield.rotation.y -= CONFIG.rotationSpeed * 0.1;
            
            controls.update();
            updateFPS();
            renderer.render(scene, camera);
        }
        
        // Start animation
        animate();
        
        // Handle resize
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.addEventListener('resize', onResize);
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            cancelAnimationFrame(animationId);
            galaxyGeometry.dispose();
            galaxyMaterial.dispose();
            starfieldGeometry.dispose();
            starfieldMaterial.dispose();
            coreGeometry.dispose();
            coreMaterial.dispose();
            renderer.dispose();
        });
    </script>
</body>
</html>
